<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Portal Bosquesinos</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #e4f1e1 0%, #a3c9a8 100%); 
            color: #1b3315; 
            padding: 20px; 
            min-height: 100vh;
            margin: 0;
        }
        .encabezado { text-align: center; margin-bottom: 30px; }
        .encabezado img { 
            width: 100px; border-radius: 50%; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); border: 3px solid white;
        }
        h1 { color: #2a4d31; margin-bottom: 5px; }
        p.subtitulo { color: #4a7c59; font-size: 16px; margin-top: 0; }
        
        .tarjeta-admin { 
            background: #eef5ef; padding: 25px; border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(45, 90, 39, 0.2); 
            max-width: 600px; margin: 0 auto 30px auto; 
            border-top: 6px solid #2a4d31;
        }
        
        input, select, textarea, button { 
            display: block; width: 100%; margin-bottom: 12px; 
            padding: 10px; box-sizing: border-box; 
            border: 1px solid #bcdec1; border-radius: 8px;
            font-family: 'Poppins', sans-serif;
        }
        textarea { resize: vertical; min-height: 80px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #386641; }
        button.btn-principal { 
            background: #386641; color: white; border: none; cursor: pointer; font-weight: 600;
        }
        button.btn-principal:hover { background: #2a4d31; }
        .oculto { display: none !important; }

        /* DISEÑO EN MOSAICO (GRID) */
        #listaPlantulas {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 0; margin: 0; list-style: none;
            max-width: 1200px; margin: 0 auto;
        }
        
        .item-planta { 
            background: white; border-radius: 12px; overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            display: flex; flex-direction: column;
            transition: transform 0.2s;
        }
        .item-planta:hover { transform: translateY(-5px); }
        
        .img-arbol {
            width: 100%; height: 200px; object-fit: cover;
            background: #d4e5d7; 
        }
        .info-arbol { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .info-arbol h3 { margin: 0 0 2px 0; color: #1b3315; font-size: 18px; }
        .info-arbol i { color: #555; font-size: 13px; display: block; margin-bottom: 10px; }
        .info-arbol p { font-size: 13px; color: #444; line-height: 1.4; margin-bottom: 15px; flex-grow: 1; }
        
        .estadisticas { 
            display: flex; justify-content: space-between; align-items: center;
            border-top: 1px solid #eee; padding-top: 10px;
        }
        .estado-tag {
            background: #a3c9a8; color: #1b3315; padding: 4px 10px;
            border-radius: 20px; font-size: 11px; font-weight: bold;
        }
        .btn-retirar {
            background: #bc4749; color: white; border: none; padding: 6px 12px; 
            font-size: 12px; border-radius: 6px; cursor: pointer; font-weight: bold;
            margin-top: 10px; width: 100%;
        }
        
        .footer-admin { text-align: center; margin-top: 40px; padding-bottom: 20px; }
        .footer-admin span { color: #6a9972; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="encabezado">
        <img src="logo.png" alt="Logo Bosquesinos" onerror="this.style.display='none'">
        <h1>Catálogo Bosquesinos</h1>
        <p class="subtitulo">Conservación y vida nativa</p>
    </div>

    <!-- PANEL ADMINISTRADOR -->
    <div id="panelAdmin" class="tarjeta-admin oculto">
        <h3 style="color: #2a4d31; margin-top: 0;">⚙️ Registrar Nueva Especie</h3>
        <form id="formPlantula">
            <input type="text" id="especie" placeholder="Nombre común (Ej. Guayacán Amarillo)" required>
            <input type="text" id="nombreCientifico" placeholder="Nombre científico (Opcional)">
            <input type="url" id="imagenUrl" placeholder="Enlace de la foto (URL - Opcional)">
            <textarea id="caracteristicas" placeholder="Características de la especie..."></textarea>
            <input type="number" id="cantidad" placeholder="Cantidad de unidades" required>
            <select id="estado">
                <option value="Germinación">🌱 Germinación</option>
                <option value="Vivero">🌿 Vivero</option>
                <option value="Lista">🌳 Lista para traslado</option>
            </select>
            <button type="submit" class="btn-principal">Guardar en Catálogo</button>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;">
<h4 style="color: #2a4d31; margin-bottom: 10px;">👤 Registrar Nuevo Asociado</h4>
<form id="formAsociado">
    <input type="text" id="nuevoEmail" placeholder="Nuevo usuario" required>
    <input type="password" id="nuevoPassword" placeholder="Contraseña temporal" required>
    <button type="button" class="btn-principal" onclick="registrarAsociado()" style="background: #4a7c59;">Crear Cuenta de Asociado</button>
</form>
        </form>
    <button type="submit" class="btn-principal">Guardar en Catálogo</button>
        </form>

        <!-- FORMULARIO PARA CREAR NUEVOS ASOCIADOS -->
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;">
        <h4 style="color: #2a4d31; margin-bottom: 10px;">👤 Registrar Nuevo Asociado</h4>
        <form id="formAsociado">
            <input type="text" id="nuevoEmail" placeholder="Nuevo usuario" required>
            <input type="password" id="nuevoPassword" placeholder="Contraseña temporal" required>
            <button type="button" class="btn-principal" onclick="registrarAsociado()" style="background: #4a7c59;">Crear Cuenta de Asociado</button>
        </form>
    </div>
    </div>

    <!-- MOSAICO DE INVENTARIO -->
    <ul id="listaPlantulas"></ul>

    <!-- BOTÓN SECRETO -->
    <div class="footer-admin">
        <span id="btnModoAdmin" onclick="toggleAdmin()">⚙️ Acceso Asociados</span>
    </div>

    <script>
        const hostUrl = '';
        let modoAdminActivo = false;

        async function cargarCatalogo() {
            try {
                const respuesta = await fetch(`${hostUrl}/api/plantulas`);
                const plantulas = await respuesta.json();
                const lista = document.getElementById('listaPlantulas');
                lista.innerHTML = ''; 
                
                plantulas.forEach(pl => {
                    const botonRetirar = modoAdminActivo 
                        ? `<button class="btn-retirar" onclick="retirarPlantula('${pl._id}')">Retirar unidades</button>` 
                        : '';
                    
                    const imagenMostrada = pl.imagenUrl ? pl.imagenUrl : 'https://via.placeholder.com/300x200/d4e5d7/386641?text=Sin+Foto';
                    const nomCientifico = pl.nombreCientifico ? `<i>${pl.nombreCientifico}</i>` : '';
                    const descrip = pl.caracteristicas ? `<p>${pl.caracteristicas}</p>` : '';

                    const item = document.createElement('li');
                    item.className = 'item-planta';
                    item.innerHTML = `
                        <img src="${imagenMostrada}" alt="${pl.especie}" class="img-arbol" onerror="this.src='https://via.placeholder.com/300x200/d4e5d7/386641?text=Error+de+Foto'">
                        <div class="info-arbol">
                            <h3>${pl.especie}</h3>
                            ${nomCientifico}
                            ${descrip}
                            <div class="estadisticas">
                                <span style="font-size: 13px; font-weight: 600; color: #386641;">📦 ${pl.cantidad} uds.</span>
                                <span class="estado-tag">${pl.estado}</span>
                            </div>
                            ${botonRetirar}
                        </div>
                    `;
                    lista.appendChild(item);
                });
            } catch (error) {
                console.error('Error al cargar');
            }
        }

        async function toggleAdmin() {
            if (modoAdminActivo) {
                modoAdminActivo = false;
                document.getElementById('panelAdmin').classList.add('oculto');
                document.getElementById('btnModoAdmin').innerText = '⚙️ Acceso Asociados';
                cargarCatalogo();
                return;
            }

            const usuario = prompt('Ingresa tu nombre de asociado:');
            if (!usuario) return;
            const codigo = prompt('Ingresa tu código de acceso:');
            if (!codigo) return;

            try {
                const res = await fetch(`${hostUrl}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: usuario, password: codigo })
                });
                
                if (res.ok) {
                    modoAdminActivo = true;
                    document.getElementById('panelAdmin').classList.remove('oculto');
                    document.getElementById('btnModoAdmin').innerText = '❌ Cerrar Sesión de Asociado';
                    cargarCatalogo(); 
                } else {
                    alert('Acceso denegado.');
                }
            } catch (err) {
                alert('Sin conexión.');
            }
        }

        document.getElementById('formPlantula').addEventListener('submit', async (e) => {
            e.preventDefault();
            const datos = {
                especie: document.getElementById('especie').value,
                nombreCientifico: document.getElementById('nombreCientifico').value,
                imagenUrl: document.getElementById('imagenUrl').value,
                caracteristicas: document.getElementById('caracteristicas').value,
                cantidad: document.getElementById('cantidad').value,
                estado: document.getElementById('estado').value
            };

            const respuesta = await fetch(`${hostUrl}/api/plantulas`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
            
            if (respuesta.ok) {
                document.getElementById('formPlantula').reset();
                cargarCatalogo(); 
            }
        });

        async function retirarPlantula(id) {
            const cantidadRetirar = prompt('¿Cuántas unidades deseas retirar?');
            if (!cantidadRetirar || isNaN(cantidadRetirar) || cantidadRetirar <= 0) return;

            await fetch(`${hostUrl}/api/plantulas/retirar`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, cantidadRetirar })
            });
            cargarCatalogo(); 
        }

        cargarCatalogo();
    // Función para enviar los datos del nuevo asociado al servidor
        async function registrarAsociado() {
            const email = document.getElementById('nuevoEmail').value;
            const password = document.getElementById('nuevoPassword').value;

            if (!email || !password) {
                alert('Por favor completa ambos campos');
                return;
            }

            try {
                const respuesta = await fetch(`${hostUrl}/api/registrar-asociado`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const resultado = await respuesta.json();
                
                if (respuesta.ok) {
                    alert(resultado.mensaje);
                    document.getElementById('formAsociado').reset();
                } else {
                    alert(resultado.error || 'No se pudo registrar');
                }
            } catch (error) {
                alert('Error de conexión');
            }
        }
    </script>
</body>
</html>
