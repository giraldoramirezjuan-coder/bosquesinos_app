<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Portal Bosquesinos</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="encabezado">
        <img src="logo.png" alt="Logo Bosquesinos" onerror="this.style.display='none'">
        <h1>Catálogo Bosquesinos</h1>
        <p class="subtitulo">Conservación y vida nativa</p>
    </div>

    <!-- PANEL ADMINISTRADOR -->
    <div id="panelAdmin" class="tarjeta-admin oculto">
        
        <!-- RESUMEN DE INVENTARIO -->
        <h3 style="color: #2a4d31; margin-top: 0; text-align: center;">📊 Resumen de Inventario</h3>
        <div class="inventory-stats">
            <div class="stat">
                <h4>Germinación</h4>
                <p id="cant-germinacion">0</p>
            </div>
            <div class="stat">
                <h4>Vivero</h4>
                <p id="cant-vivero">0</p>
            </div>
            <div class="stat">
                <h4>Listas</h4>
                <p id="cant-listas">0</p>
            </div>
        </div>
        <div class="total-general">
            <strong>Total General: </strong> <span id="total-plantulas">0</span> plántulas
        </div>

        <hr style="border: 1px solid #bcdec1; margin-bottom: 20px;">

        <h3 style="color: #2a4d31; margin-top: 0;">⚙️ Registrar Nueva Especie</h3>
        <form id="formPlantula">
            <input type="text" id="especie" placeholder="Nombre común (Ej. Guayacán Amarillo)" required>
            <input type="text" id="nombreCientifico" placeholder="Nombre científico (Opcional)">
            <input type="url" id="imagenUrl" placeholder="Enlace de la foto (URL - Opcional)">
            <textarea id="caracteristicas" placeholder="Características de la especie..."></textarea>
            <input type="number" id="cantidad" placeholder="Cantidad de unidades" required>
            <select id="estado">
                <option value="Germinación">🌱 Germinación</option>
                <option value="Vivero">🌿 Vivero</option>
                <option value="Lista">🌳 Lista para traslado</option>
            </select>
            <button type="submit" class="btn-principal">Guardar en Catálogo</button>
        </form>
    </div>

    <!-- MOSAICO DE INVENTARIO -->
    <ul id="listaPlantulas"></ul>

    <!-- BOTÓN SECRETO -->
    <div class="footer-admin">
        <span id="btnModoAdmin" onclick="toggleAdmin()">⚙️ Acceso Asociados</span>
    </div>

    <script>
        const hostUrl = '';
        let modoAdminActivo = false;

        async function cargarCatalogo() {
            try {
                const respuesta = await fetch(`${hostUrl}/api/plantulas`);
                const plantulas = await respuesta.json();
                const lista = document.getElementById('listaPlantulas');
                lista.innerHTML = ''; 
                
                let totalGerminacion = 0;
                let totalVivero = 0;
                let totalListas = 0;
                let totalGeneral = 0;

                plantulas.forEach(pl => {
                    // Calcular estadísticas según el estado (Germinación, Vivero, Lista)
                    if (pl.estado === 'Germinación') totalGerminacion += pl.cantidad;
                    if (pl.estado === 'Vivero') totalVivero += pl.cantidad;
                    if (pl.estado === 'Lista') totalListas += pl.cantidad;
                    totalGeneral += pl.cantidad;

                    const botonRetirar = modoAdminActivo 
                        ? `<button class="btn-retirar" onclick="retirarPlantula('${pl._id}')">Retirar unidades</button>` 
                        : '';
                    
                    const imagenMostrada = pl.imagenUrl ? pl.imagenUrl : 'https://via.placeholder.com/300x200/d4e5d7/386641?text=Sin+Foto';
                    const nomCientifico = pl.nombreCientifico ? `<i>${pl.nombreCientifico}</i>` : '';
                    const descrip = pl.caracteristicas ? `<p>${pl.caracteristicas}</p>` : '';

                    const item = document.createElement('li');
                    item.className = 'item-planta';
                    item.innerHTML = `
                        <img src="${imagenMostrada}" alt="${pl.especie}" class="img-arbol" onerror="this.src='https://via.placeholder.com/300x200/d4e5d7/386641?text=Error+de+Foto'">
                        <div class="info-arbol">
                            <h3>${pl.especie}</h3>
                            ${nomCientifico}
                            ${descrip}
                            <div class="estadisticas">
                                <span style="font-size: 13px; font-weight: 600; color: #386641;">📦 ${pl.cantidad} uds.</span>
                                <span class="estado-tag">${pl.estado}</span>
                            </div>
                            ${botonRetirar}
                        </div>
                    `;
                    lista.appendChild(item);
                });

                // Actualizar los textos del dashboard si el panel admin está visible
                document.getElementById('cant-germinacion').innerText = totalGerminacion;
                document.getElementById('cant-vivero').innerText = totalVivero;
                document.getElementById('cant-listas').innerText = totalListas;
                document.getElementById('total-plantulas').innerText = totalGeneral;

            } catch (error) {
                console.error('Error al cargar el catálogo:', error);
            }
        }

        async function toggleAdmin() {
            if (modoAdminActivo) {
                modoAdminActivo = false;
                document.getElementById('panelAdmin').classList.add('oculto');
                document.getElementById('btnModoAdmin').innerText = '⚙️ Acceso Asociados';
                cargarCatalogo();
                return;
            }

            const usuario = prompt('Ingresa tu nombre de asociado (email):');
            if (!usuario) return;
            const codigo = prompt('Ingresa tu contraseña:');
            if (!codigo) return;

            try {
                const res = await fetch(`${hostUrl}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: usuario, password: codigo })
                });
                
                if (res.ok) {
                    modoAdminActivo = true;
                    document.getElementById('panelAdmin').classList.remove('oculto');
                    document.getElementById('btnModoAdmin').innerText = '❌ Cerrar Sesión de Asociado';
                    cargarCatalogo(); 
                } else {
                    alert('Acceso denegado. Credenciales incorrectas.');
                }
            } catch (err) {
                alert('Sin conexión con el servidor.');
            }
        }

        document.getElementById('formPlantula').addEventListener('submit', async (e) => {
            e.preventDefault();
            const datos = {
                especie: document.getElementById('especie').value,
                nombreCientifico: document.getElementById('nombreCientifico').value,
                imagenUrl: document.getElementById('imagenUrl').value,
                caracteristicas: document.getElementById('caracteristicas').value,
                cantidad: parseInt(document.getElementById('cantidad').value),
                estado: document.getElementById('estado').value
            };

            const respuesta = await fetch(`${hostUrl}/api/plantulas`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
            
            if (respuesta.ok) {
                document.getElementById('formPlantula').reset();
                cargarCatalogo(); 
            }
        });

        async function retirarPlantula(id) {
            const cantidadRetirar = prompt('¿Cuántas unidades deseas retirar?');
            if (!cantidadRetirar || isNaN(cantidadRetirar) || cantidadRetirar <= 0) return;

            await fetch(`${hostUrl}/api/plantulas/retirar`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, cantidadRetirar })
            });
            cargarCatalogo(); 
        }

        // Cargar las plántulas apenas abre la página
        cargarCatalogo();
    </script>
</body>
</html>
